spring.application.name=arare

spring.datasource.url=${ARARE_DB_URL:jdbc:postgresql://localhost:5432/araredb}
spring.datasource.username=${ARARE_DB_USERNAME:postgres}
spring.datasource.password=${ARARE_DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# When true, attempts to CREATE DATABASE on the postgres maintenance DB at
# startup if the target DB is missing. Defaults to false: the database is
# expected to already exist (see docs). Set ARARE_FLYWAY_AUTO_CREATE_DB=true
# only for ephemeral/dev setups.
arare.flyway.auto-create-db=false

arare.cors.allowed-origins=${ARARE_CORS_ORIGINS:http://localhost:5173}

timefold.solver.termination.spent-limit=30s
# Score direction: MINIMIZE is default for penalty-based scoring
timefold.solver.environment-mode=REPRODUCIBLE

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.tool.schema=INFO
